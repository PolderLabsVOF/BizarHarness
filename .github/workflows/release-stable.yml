# .github/workflows/release-stable.yml
#
# Stable release — publishes to the @latest npm dist-tag.
#
# Trigger sources (in priority order):
#   1. Push to master where the merged HEAD commit is `chore(release): <X.Y.Z>`
#      — i.e. the operator merged a release commit. The version already lives
#      in package.json, packages/sdk/package.json, and packages/sdk/src/version.ts.
#   2. workflow_dispatch with an explicit version input — useful for re-publishing
#      an existing tag without mutating version files, or for force-cutting a
#      release from a hot-pushed master.
#
# Trusted publishing (OIDC):
#   This workflow expects `permissions: id-token: write` so it can obtain a
#   short-lived npm token from npmjs.com via the GitHub Actions OIDC token
#   exchange. The repo must be configured as a trusted publisher on the
#   @polderlabs/bizar and @polderlabs/bizar-sdk packages:
#     npmjs.com → package → Settings → Trusted publishers → GitHub Actions
#     → repository: PolderLabsVOF/BizarHarness
#     → workflow: .github/workflows/release-stable.yml
#
# What it does:
#   1. Reads the version from packages/sdk/src/version.ts (the single source).
#   2. Builds the SDK (npm run build:sdk).
#   3. Publishes @polderlabs/bizar-sdk → @latest (provenance ON).
#   4. Publishes @polderlabs/bizar     → @latest (provenance ON, deps include SDK dist).
#   5. Creates a git tag v<version> on the merged commit (idempotent).
#   6. Creates a GitHub Release with a generated changelog.
name: Release — stable (@latest)

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional explicit version override (e.g. 10.28.0). Leave empty to read from version.ts.'
        required: false
      dry_run:
        description: 'Dry run — build everything but skip npm publish + git tag + GitHub release.'
        required: false
        default: 'false'

# Allow concurrent stable releases on different SHAs (rare, but possible during
# emergency hotfixes); the npm tag write is atomic per-version so races surface
# as a non-fatal 409. Use the explicit tag to serialise.
concurrency:
  group: release-stable
  cancel-in-progress: false

permissions:
  contents: write   # for tag push
  id-token: write   # for npm OIDC trusted publishing

jobs:
  release:
    name: Publish @polderlabs/bizar + @polderlabs/bizar-sdk @ ${{ inputs.version || 'auto' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm-latest   # optional — npm Trusted Publisher can pin to this env for extra safety
    # Skip when triggered by a push to master whose HEAD commit is NOT a
    # `chore(release): X.Y.Z` release commit. The push trigger exists so
    # that merging a real release commit auto-publishes; CI and other
    # pushes (e.g. docs, fixes, hot-pushes) must not run a release.
    # workflow_dispatch always runs (operator-issued override).
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'chore(release):') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # npm 11.5.1+ is REQUIRED for OIDC trusted publishing — npm 10 (Node 22's
      # default) silently produces a misleading "is not in this registry" 404
      # even when the trust claim, the workflow filename, and the package
      # owner all line up. Node 24 ships npm 11.x, so use it for the publish
      # job. See https://github.com/kzahel/yepanywhere/blob/main/docs/tactical/
      # 007-npm-trusted-publishing-release.md for the post-mortem.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org/'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.1.0'

      - name: Install dependencies (bun install)
        run: bun install --no-save

      - name: Verify trusted-publishing runtime (npm >= 11.5.1)
        # Hard gate. If npm is too old, fail with a clear error instead of
        # the cryptic 404 that npm 10 produces mid-publish.
        run: |
          set -euo pipefail
          echo "node $(node --version)"
          NPM_VER="$(npm --version)"
          echo "npm ${NPM_VER}"
          node - "${NPM_VER}" <<'NODE'
          const v = process.argv[2].split('.');
          const major = Number(v[0] ?? 0);
          const minor = Number(v[1] ?? 0);
          const patch = Number(v[2] ?? 0);
          if (major < 11 || (major === 11 && minor < 5) || (major === 11 && minor === 5 && patch < 1)) {
            console.error(`::error::npm ${process.argv[2]} is too old for OIDC trusted publishing. Need >= 11.5.1.`);
            process.exit(1);
          }
          NODE

      - name: Detect version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            VER=$(node -p "require('./packages/sdk/src/version.ts'.replace(/\\.ts$/, '.js')).SDK_VERSION" 2>/dev/null || true)
            if [ -z "$VER" ]; then
              # Fallback — parse from version.ts without compilation
              VER=$(grep -oE '"[0-9]+\.[0-9]+\.[0-9]+"' packages/sdk/src/version.ts | head -1 | tr -d '"')
            fi
            echo "value=$VER" >> "$GITHUB_OUTPUT"
          fi
          echo "Detected version: $VER"

      - name: Validate version (X.Y.Z)
        run: |
          VER="${{ steps.version.outputs.value }}"
          if ! echo "$VER" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid stable version: $VER (must be X.Y.Z)"
            exit 1
          fi

      - name: Check tag does not already exist
        run: |
          VER="${{ steps.version.outputs.value }}"
          if git rev-parse -q --verify "refs/tags/v$VER" >/dev/null; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "::notice::Tag v$VER already exists — this is likely a re-push. Skipping tag creation but continuing publish."
            fi
          fi

      - name: Build SDK + root
        run: npm run build

      - name: Run gates (sanity check before publishing)
        run: |
          make verify-removed-surfaces verify-repo-structure check-arch clean-check check test

      - name: Publish @polderlabs/bizar-sdk @ @latest (OIDC, provenance ON)
        if: ${{ inputs.dry_run != 'true' }}
        working-directory: packages/sdk
        # OIDC trusted publishing: setup-node + registry-url injects the
        # job-level NODE_AUTH_TOKEN from the OIDC token exchange. Do NOT
        # set NODE_AUTH_TOKEN explicitly here — secrets.NPM_TOKEN is not
        # configured, and an explicit empty override breaks the OIDC path.
        run: npm publish --access public --provenance --tag latest

      - name: Publish @polderlabs/bizar @ @latest (OIDC, provenance ON)
        if: ${{ inputs.dry_run != 'true' }}
        run: npm publish --access public --provenance --tag latest

      - name: Create git tag v${{ steps.version.outputs.value }}
        if: ${{ inputs.dry_run != 'true' && github.event_name == 'push' }}
        run: |
          VER="${{ steps.version.outputs.value }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VER" -m "v$VER — stable" HEAD
          git push origin "v$VER"

      - name: Create GitHub Release
        if: ${{ inputs.dry_run != 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: "v${{ steps.version.outputs.value }} — stable"
          generate_release_notes: true
          prerelease: false
