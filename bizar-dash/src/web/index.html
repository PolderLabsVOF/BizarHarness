<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bizar Dashboard</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪩</text></svg>" />
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <!-- v3.23.0 — Mobile app CSS at a stable URL so MobileApp renders with
         styles even when the auto-redirect to /m is bypassed. -->
    <link rel="stylesheet" href="/mobile.css" />
    <script>
      // v3.5.0 — Auto-redirect to /m on mobile devices.
      // v3.23.0 — Also redirect on width alone so emulators + desktop browsers resized
      // to a narrow window still land on the mobile app. The `pointer: coarse`
      // check is kept as one signal but not required.
      (function () {
        var narrowViewport =
          window.matchMedia('(max-width: 768px)').matches ||
          window.matchMedia('(max-width: 768px) and (pointer: coarse)').matches;
        var touchDevice = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        var isMobile = narrowViewport || touchDevice;
        var wantsDesktop = new URLSearchParams(window.location.search).has('desktop');
        if (isMobile && !wantsDesktop && !window.location.pathname.startsWith('/m')) {
          window.location.replace('/m' + window.location.pathname + window.location.search);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
