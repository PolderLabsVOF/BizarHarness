<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BizarHarness Clipper</title>
  <style>
    :root {
      --bg: #1e1e2e;
      --surface: #2a2a3e;
      --border: #3a3a5e;
      --text: #e0e0f0;
      --muted: #8888aa;
      --accent: #8b5cf6;
      --success: #2ecc71;
      --error: #e74c3c;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      padding: 16px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 13px;
      background: var(--bg);
      color: var(--text);
    }
    h1 { font-size: 16px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    h1 span { background: var(--accent); padding: 0 6px; border-radius: 4px; font-size: 10px; }
    label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; margin-top: 12px; }
    input { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); font-size: 12px; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; margin-top: 10px; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { opacity: .9; }
    .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--surface); }
    .status { margin-top: 10px; padding: 8px; border-radius: 6px; font-size: 11px; display: none; }
    .status-ok { display: block; background: rgba(46,204,113,.15); color: var(--success); }
    .status-err { display: block; background: rgba(231,76,60,.15); color: var(--error); }
    hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
    .recent { list-style: none; }
    .recent li { padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 11px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .recent li:last-child { border-bottom: none; }
    .muted { color: var(--muted); font-size: 11px; text-align: center; padding: 8px 0; }
  </style>
</head>
<body>
  <h1>᛭ BizarHarness <span>Clipper</span></h1>

  <label for="dash-url">Dashboard URL</label>
  <input id="dash-url" type="text" placeholder="http://127.0.0.1:4097" />

  <button id="test-btn" class="btn btn-primary">Test Connection</button>
  <div id="status" class="status"></div>

  <hr />
  <div id="recent-header" style="display:flex;justify-content:space-between;align-items:center;">
    <strong style="font-size:12px;">Recent Clips</strong>
    <button id="refresh-btn" class="btn btn-ghost" style="margin:0;padding:4px 8px;">Refresh</button>
  </div>
  <ul id="recent-list" class="recent">
    <li class="muted">No clips yet.</li>
  </ul>

  <script src="popup.js"></script>
</body>
</html>
