<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Graphify — project knowledge graph</title>
<style>
  :root {
    --bg: #0f1115;
    --bg-elev: #181b21;
    --border: #2a2e36;
    --text: #e6e8ec;
    --text-dim: #8b92a1;
    --accent: #6366f1;
    --error: #ef4444;
    --success: #22c55e;
    --warning: #f59e0b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 18px;
    background: var(--bg-elev);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .toolbar h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .toolbar .stats {
    font-size: 12px;
    color: var(--text-dim);
    margin-left: auto;
    display: flex;
    gap: 14px;
  }
  .toolbar .stats span strong { color: var(--text); font-weight: 600; }
  button {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--accent);
    color: white;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover:not(:disabled) { background: #4f46e5; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    color: var(--text);
    border-color: var(--border);
  }
  button.secondary:hover:not(:disabled) {
    background: var(--border);
  }
  .status {
    padding: 12px 18px;
    font-size: 12px;
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    border-bottom: 1px solid var(--border);
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .status.error { background: color-mix(in srgb, var(--error) 12%, transparent); color: var(--error); }
  .status.success { background: color-mix(in srgb, var(--success) 12%, transparent); color: var(--success); }
  .status.warning { background: color-mix(in srgb, var(--warning) 12%, transparent); color: var(--warning); }
  iframe {
    flex: 1;
    border: 0;
    background: white;
  }
  .empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px;
    text-align: center;
    color: var(--text-dim);
  }
  .empty h2 { color: var(--text); margin: 0 0 8px; font-size: 18px; }
  .empty p { margin: 4px 0; max-width: 480px; line-height: 1.5; }
  .empty code {
    background: var(--bg-elev);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 12px;
    color: var(--accent);
  }
  .logs {
    padding: 8px 18px;
    max-height: 120px;
    overflow-y: auto;
    background: var(--bg);
    border-top: 1px solid var(--border);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .logs .line { white-space: pre-wrap; padding: 1px 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="toolbar">
    <h1>📊 Graphify</h1>
    <button id="build-btn">Build graph</button>
    <button id="refresh-btn" class="secondary">Refresh</button>
    <button id="report-btn" class="secondary">View report</button>
    <div class="stats">
      <span>Nodes: <strong id="stat-nodes">—</strong></span>
      <span>Edges: <strong id="stat-edges">—</strong></span>
      <span>Communities: <strong id="stat-communities">—</strong></span>
      <span>Last built: <strong id="stat-last">never</strong></span>
    </div>
  </div>
  <div id="status" class="status" hidden></div>
  <div id="main">
    <div class="empty" id="empty">
      <h2>No graph built yet</h2>
      <p>Click <strong>Build graph</strong> to extract a knowledge graph of the active project.</p>
      <p>No LLM API key? That's fine — the build runs offline in code-only mode.</p>
      <p>Output goes to <code>.bizar/graph/</code> in the project root.</p>
    </div>
    <iframe id="graph-frame" hidden></iframe>
  </div>
  <div class="logs" id="logs" hidden></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const status = $('status');
const empty = $('empty');
const frame = $('graph-frame');
const buildBtn = $('build-btn');
const refreshBtn = $('refresh-btn');
const reportBtn = $('report-btn');
const logs = $('logs');

function showStatus(msg, kind = 'info') {
  status.textContent = msg;
  status.className = 'status' + (kind !== 'info' ? ' ' + kind : '');
  status.hidden = false;
}
function hideStatus() { status.hidden = true; }
function appendLog(line) {
  if (logs.hidden) logs.hidden = false;
  const el = document.createElement('div');
  el.className = 'line';
  el.textContent = line;
  logs.appendChild(el);
  logs.scrollTop = logs.scrollHeight;
}

async function refresh() {
  try {
    const r = await fetch('/api/mods/graphify/status');
    if (!r.ok) throw new Error('status ' + r.status);
    const s = await r.json();
    $('stat-nodes').textContent = s.exists ? s.nodes : '—';
    $('stat-edges').textContent = s.exists ? s.edges : '—';
    $('stat-communities').textContent = s.exists ? s.communities : '—';
    $('stat-last').textContent = s.exists ? new Date(s.lastBuilt).toLocaleString() : 'never';
    if (s.exists && s.hasHtml) {
      empty.hidden = true;
      frame.hidden = false;
      frame.src = '/api/mods/graphify/html?_=' + Date.now();
      hideStatus();
    } else if (s.exists && !s.hasHtml) {
      empty.hidden = false;
      frame.hidden = true;
      showStatus('graph.json exists but graph.html is missing — re-run Build to regenerate.', 'warning');
    } else {
      empty.hidden = false;
      frame.hidden = true;
      hideStatus();
    }
  } catch (err) {
    showStatus('Failed to load status: ' + err.message, 'error');
  }
}

async function build() {
  buildBtn.disabled = true;
  buildBtn.textContent = 'Building…';
  showStatus('Build started — this may take 30-90 seconds on a large project.', 'info');
  logs.innerHTML = '';
  try {
    const r = await fetch('/api/mods/graphify/build', { method: 'POST' });
    if (!r.ok) throw new Error('build POST failed: ' + r.status);
    const { jobId } = await r.json();
    appendLog('Build job ' + jobId + ' started.');
    const poll = setInterval(async () => {
      try {
        const sr = await fetch('/api/mods/graphify/build/' + jobId + '/status');
        if (!sr.ok) return;
        const s = await sr.json();
        if (s.status === 'running') {
          showStatus('Building… (job ' + jobId + ')', 'info');
        } else {
          clearInterval(poll);
          buildBtn.disabled = false;
          buildBtn.textContent = 'Build graph';
          if (s.status === 'done') {
            showStatus('Build complete — ' + s.exitCode, 'success');
            appendLog('✓ Build done (exit ' + s.exitCode + ')');
            setTimeout(refresh, 500);
          } else {
            showStatus('Build failed (exit ' + s.exitCode + '). See logs.', 'error');
            appendLog('✗ Build failed (exit ' + s.exitCode + ')');
          }
        }
      } catch { /* ignore transient poll errors */ }
    }, 1500);
  } catch (err) {
    showStatus('Build failed: ' + err.message, 'error');
    buildBtn.disabled = false;
    buildBtn.textContent = 'Build graph';
  }
}

async function viewReport() {
  try {
    const r = await fetch('/api/mods/graphify/report');
    if (!r.ok) throw new Error('report not found');
    const text = await r.text();
    const win = window.open('', '_blank', 'width=900,height=700');
    win.document.write('<!doctype html><title>GRAPH_REPORT.md</title><pre style="font:13px ui-monospace,monospace; white-space:pre-wrap; padding:24px; background:#0f1115; color:#e6e8ec;">' + text.replace(/[<>&]/g, (c) => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])) + '</pre>');
    win.document.close();
  } catch (err) {
    showStatus('Report not available: ' + err.message, 'warning');
  }
}

buildBtn.addEventListener('click', build);
refreshBtn.addEventListener('click', refresh);
reportBtn.addEventListener('click', viewReport);
refresh();
</script>
</body>
</html>
