<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Impeccable</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: #0f1115;
    color: #e6e8ec;
    font-size: 14px;
    padding: 28px;
  }
  h1 { margin: 0 0 8px; font-size: 22px; }
  .lede { color: #8b92a1; max-width: 720px; line-height: 1.5; margin-bottom: 24px; }
  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .toolbar button {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid #6366f1;
    background: #6366f1;
    color: white;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .toolbar button:disabled { opacity: 0.5; cursor: not-allowed; }
  .toolbar select {
    padding: 7px 10px;
    border-radius: 8px;
    border: 1px solid #2a2e36;
    background: #181b21;
    color: #e6e8ec;
    font-size: 13px;
  }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; max-width: 980px; margin-bottom: 24px; }
  .stat {
    border: 1px solid #2a2e36;
    border-radius: 10px;
    padding: 14px;
    background: #181b21;
  }
  .stat .label { font-size: 11px; color: #8b92a1; text-transform: uppercase; letter-spacing: 0.04em; }
  .stat .value { font-size: 22px; font-weight: 700; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .findings { max-width: 980px; }
  .finding {
    border: 1px solid #2a2e36;
    border-radius: 10px;
    padding: 12px 14px;
    background: #181b21;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .finding .msg { font-family: ui-monospace, Menlo, Consolas, monospace; }
  .finding .meta { color: #8b92a1; font-size: 11px; margin-top: 4px; }
  .status { padding: 12px 14px; border-radius: 10px; background: #181b21; border: 1px solid #2a2e36; color: #8b92a1; font-size: 13px; max-width: 980px; }
  .status.error { color: #ef4444; }
  .status.success { color: #22c55e; }
  .empty { color: #8b92a1; font-style: italic; padding: 24px; text-align: center; border: 1px dashed #2a2e36; border-radius: 10px; }
</style>
</head>
<body>
<h1>🛡 Impeccable</h1>
<p class="lede">UI anti-pattern detector. Catches AI-generated UI tells, accessibility violations, and design quality issues across HTML, CSS, JSX, TSX, Vue, Svelte.</p>

<div class="toolbar">
  <select id="scope">
    <option value="src">src/</option>
    <option value="lib">lib/</option>
    <option value="components">components/</option>
    <option value="ui">ui/</option>
    <option value=".">all (. — root)</option>
  </select>
  <button id="scan-btn">Run scan</button>
  <button id="reload-btn" class="secondary" style="background:transparent;color:#6366f1">Reload</button>
</div>

<div class="status" id="status">Loading…</div>

<div class="stat-grid" id="stats" style="display:none">
  <div class="stat"><div class="label">Findings</div><div class="value" id="s-findings">—</div></div>
  <div class="stat"><div class="label">Exit</div><div class="value" id="s-exit">—</div></div>
  <div class="stat"><div class="label">Scope</div><div class="value" id="s-scope">—</div></div>
  <div class="stat"><div class="label">Last scan</div><div class="value" id="s-time">—</div></div>
</div>

<div class="findings" id="findings"></div>

<script>
const $ = (id) => document.getElementById(id);
let busy = false;

async function load() {
  busy = true;
  $('scan-btn').disabled = true;
  try {
    const r = await fetch('/api/mods/impeccable/state');
    if (!r.ok) throw new Error('status ' + r.status);
    const s = await r.json();
    $('status').className = 'status success';
    $('status').textContent = `Last scan: ${s.lastScanAt ? new Date(s.lastScanAt).toLocaleString() : 'never'} · ${s.lastFindings ?? 0} findings`;
    $('stats').style.display = 'grid';
    $('s-findings').textContent = s.lastFindings ?? 0;
    $('s-exit').textContent = s.lastExitCode ?? '—';
    $('s-scope').textContent = s.scope || '—';
    $('s-time').textContent = s.lastScanAt ? new Date(s.lastScanAt).toLocaleString() : '—';
    // Try to load findings from /report
    const rr = await fetch('/api/mods/impeccable/report');
    if (rr.ok) {
      const report = await rr.json();
      renderFindings(report.findings || []);
    } else {
      renderFindings([]);
    }
  } catch (e) {
    $('status').className = 'status error';
    $('status').textContent = 'Load failed: ' + e.message;
  } finally {
    busy = false;
    $('scan-btn').disabled = false;
  }
}

function renderFindings(findings) {
  const root = $('findings');
  if (!findings.length) {
    root.innerHTML = '<div class="empty">No findings yet. Run a scan.</div>';
    return;
  }
  root.innerHTML = '';
  for (const f of findings) {
    const div = document.createElement('div');
    div.className = 'finding';
    div.innerHTML = `<div class="msg">${(f.message || f.rule || JSON.stringify(f)).toString().replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]))}</div>` +
      `<div class="meta">${f.file || f.path || ''}${f.line ? ':' + f.line : ''} ${f.rule ? '· ' + f.rule : ''}</div>`;
    root.appendChild(div);
  }
}

async function runScan() {
  if (busy) return;
  busy = true;
  $('scan-btn').disabled = true;
  $('status').className = 'status';
  $('status').textContent = 'Running impeccable detect…';
  const scope = $('scope').value;
  try {
    const r = await fetch('/api/mods/impeccable/scan', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ scope }),
    });
    const data = await r.json();
    if (!r.ok || data.error) throw new Error(data.message || data.error || 'scan failed');
    $('status').className = 'status success';
    $('status').textContent = `Scan complete · ${data.lastFindings} findings · exit ${data.lastExitCode}`;
    $('stats').style.display = 'grid';
    $('s-findings').textContent = data.lastFindings;
    $('s-exit').textContent = data.lastExitCode;
    $('s-scope').textContent = data.scope;
    $('s-time').textContent = new Date().toLocaleString();
    renderFindings(data.findings || []);
  } catch (e) {
    $('status').className = 'status error';
    $('status').textContent = 'Scan failed: ' + e.message;
  } finally {
    busy = false;
    $('scan-btn').disabled = false;
  }
}

$('scan-btn').addEventListener('click', runScan);
$('reload-btn').addEventListener('click', load);
load();
</script>
</body>
</html>
