<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>LightRAG — Knowledge Graph RAG</title>
  <link rel="preconnect" href="https://rsms.me/" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
  <style>
    :root {
      --bg: #0e0e10;
      --bg-1: #18181b;
      --bg-2: #27272a;
      --border: rgba(255, 255, 255, 0.08);
      --border-strong: rgba(255, 255, 255, 0.16);
      --text: #ececf1;
      --text-muted: #8b95a8;
      --text-dim: #b4bcd0;
      --accent: #8b5cf6;
      --success: #22c55e;
      --warning: #f59e0b;
      --error: #ef4444;
      --info: #3b82f6;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --motion-base: 200ms;
      --motion-ease: cubic-bezier(0.2, 0, 0, 1);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; font-size: 14px; }
    .wrap { display: flex; flex-direction: column; height: 100vh; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.5rem; border-bottom: 1px solid var(--border); background: var(--bg-1); }
    .header h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
    .header .status { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8125rem; color: var(--text-muted); }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-muted); }
    .status-dot.healthy { background: var(--success); }
    .status-dot.unhealthy { background: var(--error); }
    .main { display: grid; grid-template-columns: 1fr 1.5fr; flex: 1; min-height: 0; }
    .left { display: flex; flex-direction: column; gap: 1rem; padding: 1.5rem; border-right: 1px solid var(--border); overflow-y: auto; }
    .right { display: flex; flex-direction: column; padding: 1.5rem; overflow-y: auto; }
    .card { background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 1rem; }
    .card h2 { margin: 0 0 0.75rem; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
    .field { display: flex; flex-direction: column; gap: 0.375rem; margin-bottom: 0.75rem; }
    .field label { font-size: 0.75rem; font-weight: 500; color: var(--text-dim); }
    .field input, .field select, .field textarea { padding: 0.5rem 0.625rem; background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font: inherit; font-size: 0.875rem; }
    .field textarea { min-height: 80px; resize: vertical; font-family: inherit; }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
    .btn { padding: 0.5rem 0.875rem; background: var(--accent); color: white; border: none; border-radius: var(--radius-sm); font: inherit; font-size: 0.8125rem; font-weight: 500; cursor: pointer; }
    .btn:hover { background: color-mix(in oklab, var(--accent), white 15%); }
    .btn:disabled { background: var(--bg-2); color: var(--text-muted); cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); background: var(--bg-1); }
    .answer { padding: 1.25rem; background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius-md); white-space: pre-wrap; font-size: 0.875rem; line-height: 1.6; }
    .answer.loading { opacity: 0.6; }
    .context-list { display: flex; flex-direction: column; gap: 0.5rem; max-height: 360px; overflow-y: auto; }
    .context-item { padding: 0.625rem; background: var(--bg-2); border-radius: var(--radius-sm); font-size: 0.75rem; line-height: 1.45; }
    .context-item .source { display: block; margin-top: 0.25rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; font-size: 0.6875rem; }
    .empty { padding: 2rem 1rem; text-align: center; color: var(--text-muted); font-size: 0.875rem; }
    .row { display: flex; gap: 0.5rem; align-items: center; }
    .grow { flex: 1; }
    .status-text { font-size: 0.75rem; }
    .status-text.healthy { color: var(--success); }
    .status-text.unhealthy { color: var(--error); }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="header">
      <h1>LightRAG — Knowledge Graph</h1>
      <div class="status">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">checking...</span>
      </div>
    </header>

    <main class="main">
      <div class="left">
        <div class="card">
          <h2>Query</h2>
          <div class="field">
            <label for="mode">Mode</label>
            <select id="mode">
              <option value="mix" selected>Mix (recommended)</option>
              <option value="hybrid">Hybrid</option>
              <option value="local">Local</option>
              <option value="global">Global</option>
              <option value="naive">Naive</option>
            </select>
          </div>
          <div class="field">
            <label for="query">Question</label>
            <textarea id="query" placeholder="e.g. What decisions did we make about authentication?"></textarea>
          </div>
          <div class="row">
            <button class="btn grow" id="askBtn">Ask</button>
            <button class="btn btn-ghost" id="clearBtn">Clear</button>
          </div>
        </div>

        <div class="card">
          <h2>Insert</h2>
          <div class="field">
            <label for="insertText">Text</label>
            <textarea id="insertText" placeholder="Paste content to ingest..."></textarea>
          </div>
          <div class="row">
            <button class="btn grow" id="insertTextBtn">Insert text</button>
          </div>
          <div class="field" style="margin-top: 0.5rem">
            <label for="insertFile">File path (relative to project root or absolute)</label>
            <input id="insertFile" placeholder=".obsidian/Architecture.md" />
          </div>
          <div class="row">
            <button class="btn btn-ghost grow" id="insertFileBtn">Insert file</button>
          </div>
        </div>
      </div>

      <div class="right">
        <h2 style="margin: 0 0 0.75rem; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted)">Answer</h2>
        <div class="answer empty" id="answer">Ask a question to get started.</div>

        <h2 style="margin: 1.5rem 0 0.75rem; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted)">Retrieved Context</h2>
        <div class="context-list" id="contextList">
          <div class="empty">No context yet.</div>
        </div>
      </div>
    </main>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);
    const statusDot = $('statusDot');
    const statusText = $('statusText');
    const answer = $('answer');
    const contextList = $('contextList');

    async function getModBase() {
      // The dashboard injects the mod route prefix; we use /api/mods/lightrag/*.
      return '/api/mods/lightrag';
    }

    async function refreshStatus() {
      try {
        const r = await fetch(`${await getModBase()}/status`);
        const j = await r.json();
        if (j.healthy) {
          statusDot.className = 'status-dot healthy';
          statusText.className = 'status-text healthy';
          statusText.textContent = `Healthy · ${j.config.host}:${j.config.port}`;
        } else {
          statusDot.className = 'status-dot unhealthy';
          statusText.className = 'status-text unhealthy';
          statusText.textContent = j.running ? 'Running but unhealthy' : 'Not running';
        }
      } catch (e) {
        statusDot.className = 'status-dot unhealthy';
        statusText.className = 'status-text unhealthy';
        statusText.textContent = 'Unreachable';
      }
    }

    async function startServer() {
      const r = await fetch(`${await getModBase()}/start`);
      const j = await r.json();
      if (!j.ok) alert(`Failed to start: ${j.message}`);
      refreshStatus();
    }

    async function stopServer() {
      const r = await fetch(`${await getModBase()}/stop`);
      const j = await r.json();
      if (!j.ok) alert(`Failed to stop: ${j.message}`);
      refreshStatus();
    }

    async function ask() {
      const q = $('query').value.trim();
      const mode = $('mode').value;
      if (!q) return;
      answer.className = 'answer loading';
      answer.textContent = 'Thinking...';
      contextList.innerHTML = '<div class="empty">Loading context...</div>';
      try {
        const base = await getModBase();
        // Make sure the server is running.
        await fetch(`${base}/start`);
        const r = await fetch(`${base}/proxy/query`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ query: q, mode }),
        });
        const j = await r.json();
        if (j.response) {
          answer.className = 'answer';
          answer.textContent = j.response;
        } else {
          answer.className = 'answer';
          answer.textContent = JSON.stringify(j, null, 2);
        }
        const ctx = (j.context && j.context.length) ? j.context : (j.retrieval_context && j.retrieval_context.length) ? [{ text: j.retrieval_context.join('\n\n') }] : [];
        if (ctx.length) {
          contextList.innerHTML = '';
          ctx.slice(0, 20).forEach((c) => {
            const div = document.createElement('div');
            div.className = 'context-item';
            const txt = (c.text || c.content || JSON.stringify(c)).slice(0, 600);
            const src = c.source || c.file || c.path || '';
            div.textContent = txt + (txt.length >= 600 ? '...' : '');
            if (src) {
              const s = document.createElement('span');
              s.className = 'source';
              s.textContent = src;
              div.appendChild(s);
            }
            contextList.appendChild(div);
          });
        } else {
          contextList.innerHTML = '<div class="empty">No context returned.</div>';
        }
      } catch (e) {
        answer.className = 'answer';
        answer.textContent = `Error: ${e.message}`;
        contextList.innerHTML = '<div class="empty">Request failed.</div>';
      }
    }

    async function insertText() {
      const text = $('insertText').value.trim();
      if (!text) return;
      const r = await fetch(`${await getModBase()}/insert/text`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      const j = await r.json();
      alert(JSON.stringify(j, null, 2).slice(0, 500));
    }

    async function insertFile() {
      const path = $('insertFile').value.trim();
      if (!path) return;
      const r = await fetch(`${await getModBase()}/insert/file`, {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ path }),
      });
      const j = await r.json();
      alert(JSON.stringify(j, null, 2).slice(0, 500));
    }

    $('askBtn').addEventListener('click', ask);
    $('clearBtn').addEventListener('click', () => { $('query').value = ''; answer.className = 'answer empty'; answer.textContent = 'Ask a question to get started.'; contextList.innerHTML = '<div class="empty">No context yet.</div>'; });
    $('insertTextBtn').addEventListener('click', insertText);
    $('insertFileBtn').addEventListener('click', insertFile);
    $('query').addEventListener('keydown', (e) => { if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') ask(); });

    refreshStatus();
    setInterval(refreshStatus, 5000);
  </script>
</body>
</html>
